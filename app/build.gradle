apply plugin: 'com.android.application'

def currentYear = 2026

android {
    namespace 'com.rama.okapi_zero'
    compileSdk 37

    defaultConfig {
        applicationId 'com.rama.okapi_zero'
        targetSdk 37

        versionCode 1
        versionName "${currentYear}.${versionCode}"

        resConfigs "en"
    }

    flavorDimensions "androidVersion"

    productFlavors {
        forever {
            dimension "androidVersion"
            minSdk 5
            versionNameSuffix "-forever"
        }

        zero {
            dimension "androidVersion"
            minSdk 21
            versionNameSuffix "-zero"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            vcsInfo.include = false
            signingConfig signingConfigs.getByName('debug')
        }

        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-dev'
            signingConfig signingConfigs.getByName('debug')
        }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += 'META-INF/*.version'
            excludes += 'META-INF/com/android/gradle/app-metadata.properties'
            excludes += 'kotlin/**'
        }

        jniLibs {
            useLegacyPackaging true
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def flavor = variant.flavorName

            output.outputFileName.set(
                    output.versionName.map { name ->
                        "okapi_${flavor}_${name}.apk"
                    }
            )
        }
    }
}